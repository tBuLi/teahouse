name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  # kingdon is baked in at build time, so a new kingdon release needs a rebuild.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
          activate-environment: true
      - name: Install the dependencies
        run: uv sync --frozen
      - name: Build the JupyterLite site
        run: |
          cp README.md content
          jupyter lite build --contents content --output-dir dist
          jupyter app_launcher build ${{ github.workspace }} dist
          jupyter lite build --contents content --output-dir dist
          cp launcher.css dist/lab/
          sed -i 's|</head>|<link rel="stylesheet" href="launcher.css" /></head>|' dist/lab/index.html
          grep -q launcher.css dist/lab/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4