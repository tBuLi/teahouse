[project]
name = "teahouse"
version = "0.2.0"
description = "Try the kingdon geometric algebra library in the browser."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlite-core==0.8.6",
    "jupyterlite-pyodide-kernel[lock]==0.8.6",
    "jupyterlab~=4.6.4",
    "notebook~=7.6.3",
    "jupyterlab-night",
    "jupyterlab-miami-nights",
    "jupyter-app-launcher>=0.3.2",
]

[dependency-groups]
# Baked into the browser kernel at build time (see jupyter_lite_config.json), so notebooks need no %pip install.
# Also installed in the build environment, so the anywidget and ipywidgets labextensions match the kernel's versions exactly.
kernel = [
    "kingdon",
    "symfit",
    "anywidget==0.11.0",
    "ipywidgets==8.1.9",
]

[tool.uv]
default-groups = ["kernel"]
